# Baseline for the ablation study (scripts/run_ablations.py).
# Smaller and shorter than configs/small.yaml so that several variants can be
# trained one after another in a reasonable time. Every variant uses these
# settings and changes exactly ONE thing.

name: ablation_baseline

model:
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.1
  bias: false
  use_pos_emb: true
  tie_weights: true

data:
  input_file: data/tinyshakespeare.txt
  tokenizer: char
  bpe_vocab_size: 512
  val_fraction: 0.1

train:
  seed: 1337
  device: auto
  amp: true
  batch_size: 64
  max_steps: 3000
  learning_rate: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 50
  sample_interval: 3000
  sample_tokens: 200
  out_dir: checkpoints/ablation_baseline
